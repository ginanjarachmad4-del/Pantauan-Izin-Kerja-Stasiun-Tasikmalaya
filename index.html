<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pantauan Izin Kerja Stasiun Tasikmalaya</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">

  <div class="logo-bar">
    <div class="logo-left">
      <img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/main/logo_danantara_putih.png" width="90">
    </div>

    <div class="logo-center">
      <img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_citar_2025_putih.png" width="90">
    </div>

    <div class="logo-right">
      <img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_kai_putih.png" width="70">
    </div>
  </div>

  <div class="title">
    <strong>PANTAUAN IZIN KERJA</strong><br>
    Stasiun Tasikmalaya - DAOP 2 Bandung
  </div>

</header>

<nav>
  <button onclick="showMenu('mulai')">🟢 Laporan Mulai</button>
  <button onclick="showMenu('dokumen')">📸 Dokumentasi</button>
</nav>

<hr>

<h3>📋 Pekerjaan Aktif</h3>
<ul id="jobList"></ul>

<!-- ===== MULAI ===== -->
<section id="mulai" class="menu">
<form id="izinForm">

  <input name="no_permit" placeholder="No Permit / No WKP / No WAD" required><br>
  <input name="nama_pekerjaan" placeholder="Nama Pekerjaan" required><br>
  <input name="unit_kontraktor" placeholder="Unit / Kontraktor" required><br>

  <label>Rencana Jam Mulai</label><br>
  <input type="time" name="rencana_jam_mulai" required><br>

  <label>Realisasi Jam Mulai</label><br>
  <input type="time" name="realisasi_jam_mulai" required><br>

  <label>Rencana Jam Selesai</label><br>
  <input type="time" name="rencana_jam_selesai" required><br>

  <input name="lokasi" placeholder="Lokasi Pekerjaan" required><br>

  <select name="jenis_pekerjaan" required>
    <option value="">Jenis Pekerjaan</option>
    <option>Perawatan</option>
    <option>Perbaikan</option>
    <option>Instalasi</option>
    <option>Pemeriksaan</option>
  </select><br>

  <textarea name="deskripsi" placeholder="Deskripsi Pekerjaan" required></textarea><br>

  <input name="pic" placeholder="PIC / Penanggung Jawab" required><br>
  <input class="whatsapp" name="whatsapp" placeholder="628xxxx" required><br><br>

  <button type="submit">Kirim Laporan Mulai</button>

</form>
</section>

<!-- ===== DOKUMENTASI ===== -->
<section id="dokumen" class="menu" style="display:none">
<form id="docForm">

  <select name="no_permit" id="permitDoc" required>
    <option value="">Pilih Permit</option>
  </select><br><br>

  <input type="file" id="file" accept="image/*" required>

  <div id="previewBox" style="margin-top:10px; display:none;">
    <p style="font-weight:600">Preview Dokumentasi:</p>
    <img id="imgPreview">
  </div>

  <br>
  <button type="submit">Upload</button>
</form>
</section>

<!-- ===== MODAL ===== -->
<div id="modal">
  <div class="box">
    <h3>Laporan Selesai</h3>

    <form id="modalForm">
      <input type="hidden" id="jobIndex">

      <p id="jobInfo"></p>

      <label>Realisasi Jam Selesai</label><br>
      <input type="time" name="realisasi_jam_selesai" required><br><br>

      <textarea name="hasil_pekerjaan" placeholder="Hasil pekerjaan" required></textarea><br><br>

      <button type="submit">Kirim</button>
      <button type="button" onclick="closeModal()">Batal</button>
    </form>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
